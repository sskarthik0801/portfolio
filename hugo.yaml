      I am a Graduate Student Researcher at IDEAS Lab, previously a Locomotive Onboard Technology Intern at Canadian National Railway, a Graduate Student Researcher at Purdue: Digital Twin Lab, and a Vehicle Calibration Engineer and Project Manager (R&D) at Bosch.
