    items:
      - title: "Terrain Planning and Control for Rovers Using CNN"
        content: "Oct 2025 – Nov 2025. Built a CNN-based semantic segmentation system (computer vision driven dataset) to classify diverse terrain types and infer dynamic properties (slope, friction, traversability) directly from onboard camera, RADAR, LiDAR and IMU data. Designed a physics-informed dynamic cost map that evaluates real-time terrain difficulty, enabling computation of both fastest and energy-optimal routes across unstructured environments. Implemented A* and RRT* planners in Gazebo to generate safe, efficient paths for rescue and extraterrestrial exploration rovers under varying terrain conditions. Global path is generated within 10 seconds, and a local planner generates the obstacle avoided path instantly."
